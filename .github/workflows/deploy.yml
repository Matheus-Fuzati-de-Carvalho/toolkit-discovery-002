name: Deploy Manual sob Demanda (Multiprojeto)

on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: 'ID do Projeto no GCP (ex: meu-projeto-123)'
        required: true
        type: string
      gcp_project_number:
        description: 'Número numérico do Projeto no GCP'
        required: true
        type: string
      gcp_region:
        description: 'Região do GCP (ex: us-central1)'
        required: true
        default: 'us-central1'
        type: string
      gcp_app_name:
        description: 'Nome do Aplicativo / Repositório'
        required: true
        default: 'hub-observabilidade'
        type: string

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
  GCP_REGION: ${{ inputs.gcp_region }}
  GCP_APP_NAME: ${{ inputs.gcp_app_name }}
  TF_VAR_project_id: ${{ inputs.gcp_project_id }}
  TF_VAR_region: ${{ inputs.gcp_region }}
  TF_VAR_app_name: ${{ inputs.gcp_app_name }}
  TF_VAR_artifact_registry_repo: ${{ inputs.gcp_app_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ inputs.gcp_project_number }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "gh-actions-sa@${{ inputs.gcp_project_id }}.iam.gserviceaccount.com"

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init 🏗️
        run: terraform init

      - name: Verificar e Importar Artifact Registry se existir 📦
        run: |
          if gcloud artifacts repositories describe ${{ env.GCP_APP_NAME }} --location=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} &>/dev/null; then
            echo "🎯 O repositório já existe! Sincronizando com o Terraform..."
            terraform import google_artifact_registry_repository.repo projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/repositories/${{ env.GCP_APP_NAME }}
          else
            echo "🆕 Repositório não encontrado. Criando do zero..."
            terraform apply -target=google_artifact_registry_repository.repo -auto-approve
          fi

      - name: Configurar Autenticação do Docker 🔐
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build e Push da Imagem Real 🚀
        run: |
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_APP_NAME }}/${{ env.GCP_APP_NAME }}:latest .
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_APP_NAME }}/${{ env.GCP_APP_NAME }}:latest

      - name: Verificar e Importar Cloud Run se existir ☁️
        run: |
          if gcloud run services describe ${{ env.GCP_APP_NAME }} --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} &>/dev/null; then
            echo "🎯 O Cloud Run já existe! Sincronizando para permitir atualização..."
            terraform import google_cloud_run_v2_service.app projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/services/${{ env.GCP_APP_NAME }}
          fi

      - name: Terraform Apply Completo (Criar ou Atualizar) 🚀
        run: terraform apply -auto-approve